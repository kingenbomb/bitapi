<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bit-api · 号池监控</title>
<link rel="icon" type="image/png" sizes="32x32" href="/static/bit-api-icon-32.png">
<link rel="apple-touch-icon" href="/static/bit-api-icon-180.png">
<style>
  /* 与 /portal 控制台同一套中性 slate 色阶 + 同一个强调色(--black)。
     两个页面各写一份色号迟早会歪成一深一浅,变量名保持不动只换值。 */
  :root {
    --bg:#f8fafc; --panel:#ffffff; --head:#f8fafc; --line:#e2e8f0; --line2:#f1f5f9;
    --fg:#1e293b; --dim:#64748b; --dim2:#94a3b8; --black:#a8613c;
    --ok:#15803d; --ok-bg:#eaf1ec; --warn:#a17a10; --warn-bg:#f4f0e0;
    --bad:#b91c1c; --bad-bg:#f6eaea; --gray:#64748b; --gray-bg:#f1f5f9;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
    font:14px/1.5 -apple-system,Segoe UI,Roboto,"Microsoft YaHei",sans-serif; }
  .wrap { padding:32px 40px; max-width:1240px; margin:0 auto; }

  .pagehead { display:flex; align-items:flex-start; justify-content:space-between;
    gap:20px; margin-bottom:26px; flex-wrap:wrap; }
  .pagehead h1 { font-size:28px; font-weight:700; margin:0 0 6px; letter-spacing:-.5px; }
  .pagehead .sub { color:var(--dim); font-size:13.5px; margin:0; }
  .pagehead .sub b { color:var(--fg); font-weight:600; }
  .tools { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .tools .clock { color:var(--dim2); font-size:12.5px; margin-right:6px; }

  input, button { font:inherit; border-radius:8px; border:1px solid var(--line);
    background:var(--panel); color:var(--fg); padding:7px 12px; outline:none; }
  input:focus { border-color:var(--black); }
  button { cursor:pointer; transition:.12s; }
  button:hover { border-color:var(--gray); }
  button.primary { background:var(--black); border-color:var(--black); color:#fff; font-weight:500; }
  button.primary:hover { opacity:.88; }
  button.danger { color:var(--bad); border-color:var(--line); }
  button.danger:hover { border-color:var(--bad); background:var(--bad-bg); }
  button:disabled { opacity:.5; cursor:default; }

  .cards { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:16px; margin-bottom:34px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:14px;
    padding:18px 20px; box-shadow:0 1px 2px rgba(16,24,40,.04); }
  .card .top { display:flex; align-items:center; justify-content:space-between; margin-bottom:2px; }
  .card h3 { margin:0; font-size:15.5px; font-weight:650; }
  .card .pill { font-size:11.5px; color:var(--gray); background:var(--gray-bg);
    padding:2px 9px; border-radius:20px; }
  .card .caps { font-size:11.5px; color:var(--dim2); margin:6px 0 14px; }
  .card .num { font-size:30px; font-weight:750; letter-spacing:-1px; line-height:1.1; }
  .card .numlabel { color:var(--dim); font-size:12.5px; margin-bottom:12px; }
  .card .stats { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px; }
  .card .bal { display:flex; justify-content:space-between; padding-top:12px;
    border-top:1px solid var(--line2); }
  .card .bal .dim { color:var(--dim); }
  .card .bal b { font-weight:650; }
  .card .acts { display:flex; gap:8px; margin-top:14px; padding-top:12px;
    border-top:1px solid var(--line2); }
  .card .acts button { flex:1; padding:6px 8px; font-size:12.5px; border-radius:8px; }

  .st { display:inline-flex; align-items:center; gap:5px; padding:2px 9px;
    border-radius:20px; font-size:12px; font-weight:500; }
  .st::before { content:""; width:6px; height:6px; border-radius:50%; }
  .st.active { background:var(--ok-bg); color:var(--ok); }
  .st.active::before { background:var(--ok); }
  .st.cooldown { background:var(--gray-bg); color:var(--gray); }
  .st.cooldown::before { background:var(--gray); }
  .st.exhausted { background:var(--warn-bg); color:var(--warn); }
  .st.exhausted::before { background:var(--warn); }
  .st.dead { background:var(--bad-bg); color:var(--bad); }
  .st.dead::before { background:var(--bad); }
  .st.unchecked { background:var(--gray-bg); color:var(--gray); }
  .st.unchecked::before { background:var(--gray); }

  h2 { font-size:15px; font-weight:650; margin:0 0 14px; }
  .tabs { display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap; }
  .tab { padding:6px 14px; border-radius:8px; cursor:pointer;
    border:1px solid var(--line); background:var(--panel); color:var(--gray); font-size:13px; }
  .tab:hover { border-color:var(--gray); }
  .tab.on { background:var(--black); border-color:var(--black); color:#fff; }

  .tablewrap { background:var(--panel); border:1px solid var(--line); border-radius:14px;
    overflow:hidden; box-shadow:0 1px 2px rgba(16,24,40,.04); }
  table { width:100%; border-collapse:collapse; }
  th, td { text-align:left; padding:12px 18px; font-size:13px; }
  th { color:var(--dim); font-weight:600; background:var(--head);
    border-bottom:1px solid var(--line); font-size:12px; letter-spacing:.02em; }
  td { border-bottom:1px solid var(--line2); }
  tbody tr:last-child td { border-bottom:none; }
  tbody tr:hover { background:#f8fafc; }
  td.mono { font-variant-numeric:tabular-nums; }
  .dim { color:var(--dim); }
  .pager { display:flex; align-items:center; justify-content:space-between; gap:12px;
    flex-wrap:wrap; margin-top:12px; padding:0 2px; font-size:13px; }
  .pager .pg-btns { display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
  .pager button { padding:5px 11px; font-size:12.5px; }
  button.rowdel { padding:3px 8px; border-color:transparent; background:transparent;
    font-size:14px; line-height:1; opacity:.5; }
  button.rowdel:hover { opacity:1; border-color:var(--bad); background:var(--bad-bg); }
  .modal { display:none; position:fixed; inset:0; background:rgba(16,24,40,.45);
    align-items:center; justify-content:center; z-index:50; padding:20px; }
  .modal-box { background:var(--panel); border:1px solid var(--line); border-radius:14px;
    padding:22px 24px; width:100%; max-width:560px; box-shadow:0 8px 40px rgba(16,24,40,.2); }
  .modal-box h3 { margin:0 0 8px; font-size:17px; font-weight:650; }
  .modal-box p { margin:0 0 12px; font-size:12.5px; }
  .modal-box code { background:var(--gray-bg); padding:1px 5px; border-radius:4px; font-size:11.5px; }
  .modal-box textarea { width:100%; height:200px; resize:vertical; padding:10px 12px;
    border:1px solid var(--line); border-radius:8px; font:12.5px/1.5 ui-monospace,Menlo,Consolas,monospace;
    background:var(--bg); color:var(--fg); outline:none; }
  .modal-box textarea:focus { border-color:var(--black); }
  .modal-acts { display:flex; justify-content:flex-end; gap:10px; margin-top:14px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="pagehead">
    <div>
      <h1>号池监控</h1>
      <p class="sub" id="sub">🛰️ bit-api · 加载中…</p>
    </div>
    <div class="tools">
      <span class="clock" id="msg">🕐 未刷新</span>
      <button onclick="setKey()" title="管理密钥只存在本机浏览器">密钥</button>
      <button onclick="refresh()">刷新</button>
      <button class="danger" onclick="purge()">清除失效</button>
      <button class="primary" onclick="scan()">立即巡检</button>
    </div>
  </div>
  <div class="cards" id="cards"></div>
  <h2>账号明细</h2>
  <div class="tabs" id="tabs"></div>
  <div id="table"></div>
</div>
<div class="modal" id="modal">
  <div class="modal-box">
    <h3>导入 Grok 账号</h3>
    <p class="dim">粘贴 xAI OAuth 凭据 JSON:单个 <code>{"email":...,"refresh_token":...}</code>、数组 <code>[...]</code>,或 <code>{"accounts":[...]}</code>。<code>refresh_token</code> 必须有,否则号几小时后就失效。</p>
    <textarea id="modal-ta" placeholder='{"email":"...","access_token":"...","refresh_token":"...","expired":"2026-..."}'></textarea>
    <div class="modal-acts">
      <button onclick="closeModal()">取消</button>
      <button class="primary" onclick="doGrokImport()">导入</button>
    </div>
  </div>
</div>
<script>
const $ = s => document.querySelector(s);
const BASE = location.pathname.replace(/\/admin\/ui.*$/, '');  // nginx 子路径反代兼容
let STATS = null, CUR = null;
const ZH = { active:'可用', cooldown:'冷却', exhausted:'失效', dead:'失效', unchecked:'待检' };

/* 管理密钥:本机存一份,面板自己带上 Authorization。
   原来这里硬返回 {},靠反代注入 key —— 那份配置不在仓库里,一旦面板不是从
   那条反代进来的(直连源站、换了域名、Cloudflare 那条规则只弹 Basic Auth 而
   没注入头),整页就只剩「无权限」四个字,而且没有任何自救入口。
   没存本地 key 时仍然不发头,保留反代注入那条路,两种部署都能用。 */
const KEY_STORE = 'bitapi_admin_key';
const adminKey = () => localStorage.getItem(KEY_STORE) || '';
function hdr(){ const k = adminKey(); return k ? { Authorization: 'Bearer ' + k } : {}; }

function setKey(){
  const cur = adminKey();
  const k = prompt('管理密钥(BITAPI_ADMIN_KEY)。只保存在这台浏览器,留空则清除:', cur);
  if(k === null) return false;                 // 取消
  const v = k.trim();
  if(v) localStorage.setItem(KEY_STORE, v); else localStorage.removeItem(KEY_STORE);
  refresh();
  return !!v;
}
function msg(t){ $('#msg').textContent = '🕐 ' + t; }

async function api(path){
  let r = await fetch(BASE + path, { headers: hdr() });
  /* 401 就当面问一次,而不是把人留在死胡同里 */
  if(r.status === 401 && !adminKey() && setKeyPrompt())
    r = await fetch(BASE + path, { headers: hdr() });
  if(r.status === 401){
    $('#sub').textContent = '🔒 无权限 —— 点右上「密钥」填 BITAPI_ADMIN_KEY,'
      + '或让反代注入 Authorization';
    throw new Error('401');
  }
  return r.json();
}

/* 和 setKey 分开:这个只存不刷新,避免在 api() 里递归触发一轮请求 */
function setKeyPrompt(){
  const k = prompt('需要管理密钥(BITAPI_ADMIN_KEY)。只保存在这台浏览器:', '');
  const v = (k || '').trim();
  if(v) localStorage.setItem(KEY_STORE, v);
  return !!v;
}

async function refresh(){
  try {
    STATS = await api('/admin/stats');
    renderSub(); renderCards(); renderTabs();
    if(!CUR) CUR = Object.keys(STATS.channels)[0];
    if(CUR) loadAccounts(CUR);
    msg('最近刷新 ' + new Date().toLocaleTimeString());
  } catch(e){}
}

function renderSub(){
  const pool = STATS.pool || {}, ch = STATS.channels || {};
  let total=0, active=0, money=0, credits=0, chn=Object.keys(ch).length;
  for(const [name, p] of Object.entries(pool)){
    total += p.total||0; active += (p.by_status||{}).active||0;
    const balCol = ((ch[name]||{}).columns || []).find(c => c.key === 'balance');
    if(balCol && balCol.type === 'credits') credits += p.balance||0;
    else money += p.balance||0;
  }
  const parts = [];
  if(money)   parts.push(`$${money.toFixed(2)}`);
  if(credits) parts.push(`${credits.toFixed(0)} credits`);
  const balStr = parts.join(' + ') || '$0.00';
  $('#sub').innerHTML = `<b>${chn}</b> 渠道 · <b>${total}</b> 账号 · <b>${active}</b> 可用 · 总额 <b>${balStr}</b>`;
}

function renderCards(){
  const ch = STATS.channels, pool = STATS.pool || {};
  $('#cards').innerHTML = Object.entries(ch).map(([name, meta]) => {
    const p = pool[name] || { total:0, balance:0, by_status:{} };
    const bs = p.by_status || {};
    const balCol = (meta.columns || []).find(c => c.key === 'balance');
    const balStr = balCol && balCol.type === 'credits'
      ? `${(p.balance||0).toFixed(0)} credits`
      : `$${(p.balance||0).toFixed(2)}`;
    const bal = meta.capabilities.includes('balance')
      ? `<div class="bal"><span class="dim">余额合计</span><b>${balStr}</b></div>` : '';
    const stLine = ['active','cooldown','exhausted','dead','unchecked']
      .filter(s => bs[s]).map(s => `<span class="st ${s}">${ZH[s]} ${bs[s]}</span>`).join('')
      || '<span class="dim">—</span>';
    return `<div class="card">
      <div class="top"><h3>${name}</h3><span class="pill">${(meta.models||[]).length} 模型</span></div>
      <div class="caps">${meta.capabilities.join(' · ')}</div>
      <div class="num">${p.total||0}</div>
      <div class="numlabel">账号总数</div>
      <div class="stats">${stLine}</div>
      ${bal}
      <div class="acts">
        <button onclick="scan('${name}')">巡检</button>
        ${name==='grok' ? `<button onclick="grokImport()">导入号</button>` : ''}
        <button class="danger" onclick="purge('${name}')">清失效</button>
        <button class="danger" onclick="delChannel('${name}')">删除渠道</button>
      </div>
    </div>`;
  }).join('') || '<div class="dim">无渠道</div>';
}

function renderTabs(){
  $('#tabs').innerHTML = Object.keys(STATS.channels).map(name =>
    `<div class="tab ${name===CUR?'on':''}" onclick="loadAccounts('${name}')">${name}</div>`).join('');
}

const PSIZE = 50;   // 每页账号数
let OFFSET = 0;     // 当前页偏移

async function loadAccounts(name, offset){
  if(name !== CUR) OFFSET = 0;       // 切渠道重置到第一页
  else if(offset != null) OFFSET = Math.max(0, offset);
  CUR = name; renderTabs();
  const meta = STATS.channels[name];
  const cols = (meta.columns||[]).filter(c => !['status','email'].includes(c.key));
  const data = await api(`/admin/accounts?channel=${encodeURIComponent(name)}&offset=${OFFSET}&limit=${PSIZE}`);
  const accts = data.accounts || [];
  const total = data.total || 0;
  const head = ['<th>identity</th>','<th>状态</th>']
    .concat(cols.map(c => `<th>${c.label}</th>`)).concat(['<th>最后检查</th>','<th></th>']).join('');
  const rows = accts.map(a => {
    const cells = cols.map(c => {
      let v = a[c.key];
      if(c.type === 'money' && v != null) v = '$' + Number(v).toFixed(4);
      else if(c.type === 'credits' && v != null) v = Number(v).toFixed(0) + ' credits';
      else if(c.type === 'time' && v) v = new Date(v*1000).toLocaleString();
      return `<td class="mono">${v ?? '<span class="dim">—</span>'}</td>`;
    }).join('');
    const lc = a.last_check ? new Date(a.last_check*1000).toLocaleTimeString() : '—';
    const id = encodeURIComponent(a.identity);
    return `<tr><td class="mono">${a.identity}</td><td><span class="st ${a.status}">${ZH[a.status]||a.status}</span></td>${cells}<td class="dim mono">${lc}</td><td><button class="rowdel" title="删除此账号" onclick="delAccount('${name}','${id}')">🗑</button></td></tr>`;
  }).join('');
  const span = cols.length + 4;
  $('#table').innerHTML = `<div class="tablewrap"><table><thead><tr>${head}</tr></thead><tbody>${rows||`<tr><td colspan="${span}" class="dim">无账号</td></tr>`}</tbody></table></div>${pager(name, total)}`;
}

function pager(name, total){
  if(!total) return '';
  const from = total ? OFFSET + 1 : 0, to = Math.min(OFFSET + PSIZE, total);
  const page = Math.floor(OFFSET / PSIZE) + 1, pages = Math.max(1, Math.ceil(total / PSIZE));
  const prevOff = Math.max(0, OFFSET - PSIZE), nextOff = OFFSET + PSIZE;
  return `<div class="pager">
    <span class="dim">${from}–${to} / 共 ${total}</span>
    <span class="pg-btns">
      <button ${OFFSET<=0?'disabled':''} onclick="loadAccounts('${name}',0)">« 首页</button>
      <button ${OFFSET<=0?'disabled':''} onclick="loadAccounts('${name}',${prevOff})">‹ 上一页</button>
      <span class="dim">第 ${page} / ${pages} 页</span>
      <button ${nextOff>=total?'disabled':''} onclick="loadAccounts('${name}',${nextOff})">下一页 ›</button>
      <button ${nextOff>=total?'disabled':''} onclick="loadAccounts('${name}',${(pages-1)*PSIZE})">末页 »</button>
    </span>
  </div>`;
}

async function delAccount(channel, idEnc){
  const identity = decodeURIComponent(idEnc);
  if(!confirm(`确认删除账号【${identity}】?`)) return;
  msg('删除 ' + identity + '…');
  try {
    const r = await fetch(`${BASE}/admin/account/delete?channel=${encodeURIComponent(channel)}&identity=${idEnc}`, { method:'POST', headers: hdr() });
    await r.json();
    msg('已删除 ' + identity);
    STATS = await api('/admin/stats'); renderCards();
    loadAccounts(channel, OFFSET);
  } catch(e){ msg('删除失败'); }
}

function grokImport(){
  $('#modal').style.display = 'flex';
  $('#modal-ta').value = '';
  $('#modal-ta').focus();
}
function closeModal(){ $('#modal').style.display = 'none'; }

async function doGrokImport(){
  const raw = $('#modal-ta').value.trim();
  if(!raw){ return; }
  let payload;
  try { payload = JSON.parse(raw); }
  catch(e){ alert('JSON 解析失败:' + e.message); return; }
  msg('导入 grok 号…');
  try {
    const r = await fetch(`${BASE}/admin/grok/import`, { method:'POST', headers:{...hdr(),'Content-Type':'application/json'}, body: JSON.stringify(payload) });
    const j = await r.json();
    msg(`导入完成:成功 ${j.count||0}${(j.errors&&j.errors.length)?' · 失败 '+j.errors.length:''}`);
    if(j.errors && j.errors.length) alert('部分失败:\n' + j.errors.join('\n'));
    closeModal(); refresh();
  } catch(e){ msg('导入失败'); }
}

async function delChannel(channel){
  const p = (STATS.pool||{})[channel] || {}; const n = p.total || 0;
  if(!confirm(`确认删除渠道【${channel}】的全部 ${n} 个账号?此操作不可恢复!\n(adapter 仍在代码里,卡片会显示 0)`)) return;
  const typed = prompt(`高危操作。请输入渠道名「${channel}」确认删除:`);
  if(typed !== channel){ msg('已取消(输入不匹配)'); return; }
  msg('删除渠道 ' + channel + '…');
  try {
    const r = await fetch(`${BASE}/admin/channel/delete?channel=${encodeURIComponent(channel)}`, { method:'POST', headers: hdr() });
    const j = await r.json();
    msg(`已删除渠道 ${channel} ${j.deleted ?? 0} 个账号`);
    refresh();
  } catch(e){ msg('删除失败'); }
}

async function scan(channel){
  const q = channel ? '?channel=' + encodeURIComponent(channel) : '';
  msg((channel ? channel + ' ' : '') + '巡检中…');
  try {
    const r = await fetch(BASE + '/admin/scan' + q, { method:'POST', headers: hdr() });
    const j = await r.json();
    msg((channel ? channel + ' ' : '') + '巡检完成 ' + JSON.stringify(j.result || {}));
    refresh();
  } catch(e){ msg('巡检失败'); }
}

async function purge(channel){
  const label = channel || '全部渠道';
  if(!confirm('确认清除【' + label + '】的失效账号?权限拒绝和额度耗尽账号也会删除，冷却账号不会删除。此操作不可恢复。')) return;
  const q = channel ? '?channel=' + encodeURIComponent(channel) : '';
  msg('清理 ' + label + '…');
  try {
    const r = await fetch(BASE + '/admin/purge' + q, { method:'POST', headers: hdr() });
    const j = await r.json();
    msg('已清除 ' + label + ' ' + (j.deleted ?? 0) + ' 个账号');
    refresh();
  } catch(e){ msg('清理失败'); }
}

refresh();
setInterval(refresh, 30000);
</script>
</body>
</html>
