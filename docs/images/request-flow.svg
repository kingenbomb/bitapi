<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">一次用户对话请求的生命周期</title>
  <desc id="desc">VIEW-README-002，confirmed。依据 server.py、core/pool.py、core/metering.py、core/billing.py 与 core/credit.py。参与者为客户端、网关、上游 Adapter 与模型、SQLite 账务存储。鉴权与预检失败时返回错误，通过后调用上游并流式返回内容，结束时计量定价，分别记录余额流水和使用记录，随后发出事件。仅无上游输出时允许符合条件的切换，不提供整请求全局原子保证。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker>
    <style>
      text { font-family: 'Microsoft YaHei', 'Noto Sans CJK SC', Arial, sans-serif; fill: #0f172a; }
      .title { font-size: 38px; font-weight: 700; }
      .node { font-size: 26px; font-weight: 700; }
      .body { font-size: 22px; fill: #475569; }
      .small { font-size: 19px; fill: #475569; }
      .meta { font-size: 17px; fill: #64748b; }
      .edge { fill: none; stroke: #64748b; stroke-width: 2.5; marker-end: url(#arrow); }
      .lifeline { stroke: #cbd5e1; stroke-width: 2; stroke-dasharray: 4 7; }
    </style>
  </defs>
  <rect width="1600" height="900" rx="24" fill="#f8fafc"/>
  <rect x="64" y="54" width="6" height="44" rx="3" fill="#ea580c"/>
  <text class="title" x="88" y="89">一次请求，如何完成</text>
  <text class="meta" x="1536" y="83" text-anchor="end">VIEW-README-002 · confirmed</text>
  <text class="body" x="64" y="140">用户 API Key 对话主路径：边响应边计量，结束后按策略结算。</text>
  <line x1="64" y1="178" x2="1536" y2="178" stroke="#e2e8f0" stroke-width="2"/>

  <g id="actor-client"><rect x="64" y="208" width="230" height="66" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text class="node" x="179" y="250" text-anchor="middle">客户端</text></g>
  <g id="actor-gateway" data-source="server.py"><rect x="475" y="208" width="280" height="66" rx="12" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text class="node" x="615" y="250" text-anchor="middle">bit-api 网关</text></g>
  <g id="actor-upstream" data-source="core/pool.py adapters/"><rect x="890" y="208" width="295" height="66" rx="12" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text class="node" x="1038" y="250" text-anchor="middle">Adapter / 上游</text></g>
  <g id="actor-data" data-source="core/billing.py core/credit.py"><rect x="1260" y="208" width="276" height="66" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text class="node" x="1398" y="250" text-anchor="middle">账务与使用记录</text></g>
  <path class="lifeline" d="M179 274V778M615 274V778M1038 274V778M1398 274V778"/>

  <path class="edge" d="M179 324H615"/>
  <text class="body" x="393" y="311" text-anchor="middle">01  请求 + 用户密钥</text>
  <rect x="428" y="346" width="373" height="70" rx="10" fill="#ffedd5" stroke="#ea580c"/>
  <text class="body" x="615" y="374" text-anchor="middle">鉴权 · 模型 / IP 权限</text>
  <text class="small" x="615" y="402" text-anchor="middle">余额 / 密钥额度 / RPM 预检</text>
  <path class="edge" d="M428 388H179" style="stroke:#dc2626"/>
  <text class="small" x="290" y="376" text-anchor="middle" style="fill:#b91c1c">失败：返回错误</text>

  <path class="edge" d="M615 454H1038"/>
  <text class="body" x="826" y="441" text-anchor="middle">02  选渠道、取号与发起请求</text>
  <rect x="1090" y="338" width="446" height="86" rx="10" fill="#fef2f2" stroke="#dc2626"/>
  <text class="small" x="1110" y="372" style="fill:#b91c1c">重试边界</text>
  <text class="small" x="1110" y="401">仅未输出时按条件切换账号或渠道。</text>

  <path class="edge" d="M1038 516H615"/>
  <text class="body" x="826" y="503" text-anchor="middle">03  内容 / 工具事件 / usage</text>
  <path class="edge" d="M615 555H179"/>
  <text class="body" x="397" y="542" text-anchor="middle">持续输出，累计计量信息</text>

  <rect x="428" y="588" width="373" height="70" rx="10" fill="#ffedd5" stroke="#ea580c"/>
  <text class="body" x="615" y="617" text-anchor="middle">04  结束：用量归一与定价</text>
  <text class="small" x="615" y="645" text-anchor="middle">真实 usage 优先 / 估算兜底</text>
  <path class="edge" d="M801 625H1398"/>
  <text class="body" x="1098" y="612" text-anchor="middle">05  按分组策略结算、记录用量</text>
  <rect x="1110" y="654" width="426" height="108" rx="10" fill="#dbeafe" stroke="#2563eb"/>
  <text class="small" x="1130" y="684">余额策略且费用 &gt; 0：幂等扣款</text>
  <text class="small" x="1130" y="714">免费 / 配额策略：不扣余额</text>
  <text class="small" x="1130" y="744">用量另写 usage_logs（非全局事务）</text>
  <rect x="428" y="700" width="373" height="52" rx="10" fill="#dcfce7" stroke="#16a34a"/>
  <text class="body" x="615" y="734" text-anchor="middle">06  发出用量事件，执行插件</text>

  <line x1="64" y1="806" x2="1536" y2="806" stroke="#e2e8f0" stroke-width="2"/>
  <text class="small" x="64" y="840">从上向下读时间。实线为请求、响应或写入，竖虚线为参与者生命线；红色为校验失败与重试边界。</text>
  <text class="small" x="64" y="874">不预占余额；断连后尝试排空上游再结算。图中省略内部主密钥旁路、可选协议分支与网络异常细节。</text>
</svg>
