<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">bit-api 系统连接关系</title>
  <desc id="desc">VIEW-README-001，confirmed。依据 server.py、routers/portal.py、core/channels.py、core/hooks.py 与 core/credit.py。范围为已提交的单机网关及逻辑模块，省略可选支付、邮件、社区服务。客户端调用网关，控制台维护配置，适配器连接上游，SQLite 保存数据，事件插件扩展策略。实线箭头表示调用或数据访问，不代表独立微服务。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker>
    <style>
      text { font-family: 'Microsoft YaHei', 'Noto Sans CJK SC', Arial, sans-serif; fill: #0f172a; }
      .title { font-size: 38px; font-weight: 700; }
      .node { font-size: 27px; font-weight: 700; }
      .body { font-size: 22px; fill: #475569; }
      .small { font-size: 19px; fill: #475569; }
      .meta { font-size: 17px; fill: #64748b; }
      .edge { fill: none; stroke: #64748b; stroke-width: 2.5; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1600" height="900" rx="24" fill="#f8fafc"/>
  <rect x="64" y="54" width="6" height="44" rx="3" fill="#ea580c"/>
  <text class="title" x="88" y="89">系统连接关系</text>
  <text class="meta" x="1536" y="83" text-anchor="end">VIEW-README-001 · confirmed</text>
  <text class="body" x="64" y="140">统一 API 接入与管理入口，保留清晰的适配、数据和策略边界。</text>
  <line x1="64" y1="178" x2="1536" y2="178" stroke="#e2e8f0" stroke-width="2"/>

  <rect x="440" y="208" width="710" height="558" rx="20" fill="#ffffff" stroke="#9333ea" stroke-width="2"/>
  <text class="body" x="480" y="248" style="fill:#7e22ce">bit-api · 单机部署 / 单 worker</text>

  <g id="client-apps">
    <rect x="64" y="280" width="280" height="110" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text class="node" x="204" y="324" text-anchor="middle">应用与 SDK</text>
    <text class="body" x="204" y="360" text-anchor="middle">用户 API Key</text>
  </g>
  <g id="portal-users">
    <rect x="64" y="474" width="280" height="110" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text class="node" x="204" y="518" text-anchor="middle">浏览器控制台</text>
    <text class="body" x="204" y="554" text-anchor="middle">用户 / 管理员</text>
  </g>
  <g id="gateway-api" data-source="server.py">
    <rect x="480" y="280" width="630" height="110" rx="14" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
    <text class="node" x="795" y="324" text-anchor="middle">统一网关入口</text>
    <text class="body" x="795" y="360" text-anchor="middle">协议转换 · 鉴权 · 权限与额度预检</text>
  </g>
  <g id="portal-api" data-source="routers/portal.py">
    <rect x="480" y="474" width="270" height="110" rx="14" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
    <text class="node" x="615" y="518" text-anchor="middle">用户与管理 API</text>
    <text class="body" x="615" y="554" text-anchor="middle">配置 · 密钥 · 账务查询</text>
  </g>
  <g id="routing-adapters" data-source="core/adapter.py core/pool.py core/billing.py">
    <rect x="820" y="474" width="290" height="110" rx="14" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
    <text class="node" x="965" y="518" text-anchor="middle">渠道与 Adapter</text>
    <text class="body" x="965" y="554" text-anchor="middle">号池 · 转发 · 计量结算</text>
  </g>
  <g id="upstream-services">
    <rect x="1240" y="474" width="296" height="110" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text class="node" x="1388" y="518" text-anchor="middle">上游模型服务</text>
    <text class="body" x="1388" y="554" text-anchor="middle">自备地址、账号与额度</text>
  </g>
  <g id="sqlite-data" data-source="core/db.py core/user_db.py">
    <rect x="480" y="650" width="270" height="90" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text class="node" x="615" y="688" text-anchor="middle">SQLite</text>
    <text class="small" x="615" y="720" text-anchor="middle">用户 / 配置 / 用量 / 流水</text>
  </g>
  <g id="event-plugins" data-source="core/hooks.py plugins/">
    <rect x="820" y="650" width="290" height="90" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text class="node" x="965" y="688" text-anchor="middle">事件插件</text>
    <text class="small" x="965" y="720" text-anchor="middle">返佣 / 活动 / 运维告警</text>
  </g>

  <path class="edge" d="M344 335H480"/>
  <text class="small" x="412" y="319" text-anchor="middle">/v1/*</text>
  <path class="edge" d="M344 529H480"/>
  <text class="small" x="412" y="513" text-anchor="middle">/api/*</text>
  <path class="edge" d="M965 390V474"/>
  <text class="small" x="985" y="438">选择渠道</text>
  <path class="edge" d="M1110 529H1240"/>
  <text class="small" x="1175" y="513" text-anchor="middle">上游请求</text>
  <path class="edge" d="M615 584V650"/>
  <text class="small" x="590" y="623" text-anchor="end">读写配置</text>
  <path class="edge" d="M905 584V615H725V650"/>
  <text class="small" x="813" y="604" text-anchor="middle">读配置 / 记用量</text>
  <path class="edge" d="M1035 584V650"/>
  <text class="small" x="1052" y="623">发事件</text>
  <path class="edge" d="M820 695H750"/>
  <text class="meta" x="785" y="680" text-anchor="middle">credit()</text>

  <rect x="64" y="813" width="14" height="14" rx="3" fill="#ea580c"/><text class="small" x="89" y="827">应用与 API</text>
  <rect x="260" y="813" width="14" height="14" rx="3" fill="#2563eb"/><text class="small" x="285" y="827">持久化数据</text>
  <rect x="455" y="813" width="14" height="14" rx="3" fill="#16a34a"/><text class="small" x="480" y="827">业务策略</text>
  <rect x="630" y="813" width="14" height="14" rx="3" fill="#9333ea"/><text class="small" x="655" y="827">部署边界</text>
  <path class="edge" d="M850 820H899"/><text class="small" x="915" y="827">实线：调用或数据访问</text>
  <text class="small" x="64" y="872">模块不是微服务；插件在进程内执行。支付、SMTP、社区认证等可选连接未在图中展开。</text>
</svg>
